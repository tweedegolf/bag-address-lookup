[package]
name = "bagatel"
version = "0.8.3"
edition = "2024"
default-run = "bagatel"
license = "MIT OR Apache-2.0"
description = "Dutch BAG address lookup: find the street and locality for a postal code and house number, as a library or self-contained HTTP service"
repository = "https://github.com/tweedegolf/bag-address-lookup"
readme = "README.md"
keywords = ["bag", "address", "postcode", "lookup", "netherlands"]
categories = ["database-implementations"]
include = [
    "src/**",
    "data/bag.bin",
    "README.md",
    "LICENCE-APACHE",
    "LICENCE-MIT",
]

[[bin]]
name = "bagatel"
path = "src/bin/service.rs"
required-features = []

[[bin]]
name = "create-db"
path = "src/bin/create_db.rs"
required-features = ["create"]

[features]
default = ["compressed_database", "cli", "webservice"]
compressed_database = ["dep:zstd"]
create = ["dep:zip", "dep:quick-xml", "dep:serde_json", "dep:rayon"]
cli = []
webservice = ["dep:tokio", "dep:serde_json", "dep:serde", "dep:percent-encoding"]

[dependencies]
zstd = { version = "0.13", optional = true }
percent-encoding = { version = "2", optional = true }
quick-xml = { version = "0.42", optional = true }
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time"], optional = true }
zip = { version = "8", optional = true }
