name: Publish crate

# Publishes to crates.io via trusted publishing (OIDC, no long-lived token).
# crates.io blocks the `workflow_run` trigger for trusted publishing, so this
# lives in its own `workflow_dispatch` workflow, dispatched by build.yml on a
# `lib-v*` tag (which contains data/bag.bin, required to package the crate).

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check database presence
        shell: bash
        run: |
          if [[ ! -s data/bag.bin ]]; then
            echo "data/bag.bin is missing; dispatch this workflow on a lib-v* tag" >&2
            exit 1
          fi

      - name: Setup Rust
        shell: bash
        run: rustup update stable && rustup default stable

      - name: Check crates.io for existing version
        id: existing
        shell: bash
        run: |
          version=$(awk -F' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -A "bagatel-ci (github.com/tweedegolf/bag-address-lookup)" \
            "https://crates.io/api/v1/crates/bagatel/${version}")
          if [[ "$status" == "200" ]]; then
            echo "Version ${version} is already on crates.io; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io
        if: steps.existing.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: steps.existing.outputs.published == 'false'
        shell: bash
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
